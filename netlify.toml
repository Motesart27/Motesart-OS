[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://deployable-python-codebase-som-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://deploy-preview-22--motesart-os.netlify.app/assets/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "https://deploy-preview-22--motesart-os.netlify.app/operator-bridge-staging"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "https://deploy-preview-22--motesart-os.netlify.app/operator-bridge-staging/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
